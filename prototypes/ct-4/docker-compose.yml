services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openlinear_ct4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prototype-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openlinear_ct4"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ct4-postgres:/var/lib/postgresql/data

volumes:
  ct4-postgres:
